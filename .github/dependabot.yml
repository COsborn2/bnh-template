version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/cron"
      - "/apps/migrate"
      - "/apps/web"
      - "/apps/ws"
      - "/infra/proxy"
    schedule:
      interval: "daily"
    groups:
      docker-images:
        patterns:
          - "*"
    # A node major also swaps the Debian/glibc base underneath sharp and the
    # standalone server, and grouped docker PRs can carry a major under a
    # minor/patch update-type, slipping past the auto-merge gate's
    # minor/patch-only check (PR #139 auto-merged a 22->26 node major that
    # way) — so keep base-image majors out of Dependabot and take them
    # deliberately.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "oven/bun"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
