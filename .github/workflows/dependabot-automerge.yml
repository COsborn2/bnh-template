name: Dependabot Auto-Merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Verify Dependabot-only changes
        run: |
          non_dependabot_commits="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            --jq '.[] | select((.author.login // "") != "dependabot[bot]") | "\(.sha) author=\(.author.login // "unknown")"')"
          if [[ -n "$non_dependabot_commits" ]]; then
            echo "Dependabot auto-merge refused: PR contains non-Dependabot commits."
            echo "$non_dependabot_commits"
            exit 1
          fi

          disallowed_files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | select(.filename | test("(^|/)package\\.json$|^bun\\.lock$|(^|/)Dockerfile$") | not) | .filename')"
          if [[ -n "$disallowed_files" ]]; then
            echo "Dependabot auto-merge refused: PR changes files outside package manifests, lockfiles, and Dockerfiles."
            echo "$disallowed_files"
            exit 1
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # steps.metadata.outputs.update-type is the HIGHEST update-type across a
      # grouped PR, and docker tags like "22-slim" -> "26-slim" produce no
      # parseable update-type at all — which is how PR #139 auto-merged a node
      # major under its group's minor/patch label. Gate on every dependency
      # individually instead: a dependency qualifies only as a proven
      # semver-minor or semver-patch, or as a digest-only refresh (same
      # version tag). Anything else — majors and unparseable bumps alike —
      # leaves the PR open for a human, with CI (including the web container
      # startup smoke test) already run against it.
      - name: Check every updated dependency is minor, patch, or digest-only
        id: gate
        env:
          DEPS_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail

          eligible="$(jq -r '
            if length == 0 then "false" else
              all(.[];
                (.updateType == "version-update:semver-minor")
                or (.updateType == "version-update:semver-patch")
                or (((.prevVersion // "") != "") and (.prevVersion == .newVersion))
              ) | tostring
            end
          ' <<<"${DEPS_JSON}")"

          jq -r '.[] | "\(.dependencyName): \(.prevVersion // "?") -> \(.newVersion // "?") [\(.updateType // "unknown")]"' <<<"${DEPS_JSON}"
          echo "eligible=${eligible}" >> "$GITHUB_OUTPUT"
          echo "eligible=${eligible}"

      - name: Approve PR
        if: steps.gate.outputs.eligible == 'true'
        # Approve with a PAT, not GITHUB_TOKEN: github-actions[bot] approvals
        # fail when "Allow GitHub Actions to create and approve pull requests"
        # is disabled and may not satisfy branch protection review requirements.
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_PAT }}

      - name: Auto-merge minor and patch updates
        if: steps.gate.outputs.eligible == 'true'
        # Keep the squash body controlled so upstream release notes cannot
        # inject commit directives like [skip ci] into main.
        #
        # Use a non-GITHUB_TOKEN identity so the resulting merge is not attributed
        # to github-actions[bot]. Otherwise GitHub's anti-recursion rule suppresses
        # the post-merge push event and the CI/deploy pipeline never fires.
        run: |
          gh pr merge --auto --squash "$PR_URL" \
            --match-head-commit "$PR_HEAD_SHA" \
            --subject "$PR_TITLE (#$PR_NUMBER)" \
            --body "Automated Dependabot dependency update. See the pull request for package details."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_PAT }}
