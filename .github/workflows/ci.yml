name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  REPOSITORY_URL: https://github.com/${{ github.repository }}

jobs:
  changes:
    name: Detect Deploy Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.turbo.outputs.web }}
      api: ${{ steps.turbo.outputs.api }}
      ws: ${{ steps.turbo.outputs.ws }}
      cron: ${{ steps.turbo.outputs.cron }}
      migrate: ${{ steps.turbo.outputs.migrate }}
      proxy: ${{ steps.filter.outputs.proxy }}
      deploy_matrix: ${{ steps.matrix.outputs.deploy_matrix }}
      has_deploy_changes: ${{ steps.matrix.outputs.has_deploy_changes }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect affected Turbo services
        id: turbo
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git merge-base HEAD origin/main)"
          fi

          raw_output="${RUNNER_TEMP}/turbo-affected.raw"
          json_output="${RUNNER_TEMP}/turbo-affected.json"

          bunx turbo query affected \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --tasks build > "${raw_output}"

          sed -n '/^{/,$p' "${raw_output}" > "${json_output}"

          for service in web api ws cron migrate; do
            task="@app/${service}#build"
            if jq -e --arg task "${task}" '.data.affectedTasks.items[]? | select(.fullName == $task)' "${json_output}" >/dev/null; then
              echo "${service}=true" >> "${GITHUB_OUTPUT}"
            else
              echo "${service}=false" >> "${GITHUB_OUTPUT}"
            fi
          done

          {
            echo "### Turbo affected build tasks"
            echo ""
            jq -r '.data.affectedTasks.items[]?.fullName // empty' "${json_output}" | sed 's/^/- `/' | sed 's/$/`/'
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            proxy:
              - 'infra/proxy/**'

      - name: Build affected service matrix
        id: matrix
        env:
          WEB_CHANGED: ${{ steps.turbo.outputs.web }}
          API_CHANGED: ${{ steps.turbo.outputs.api }}
          WS_CHANGED: ${{ steps.turbo.outputs.ws }}
          CRON_CHANGED: ${{ steps.turbo.outputs.cron }}
          MIGRATE_CHANGED: ${{ steps.turbo.outputs.migrate }}
          PROXY_CHANGED: ${{ steps.filter.outputs.proxy }}
        run: |
          set -euo pipefail

          matrix="$(
            jq -cn \
              --arg web "$WEB_CHANGED" \
              --arg api "$API_CHANGED" \
              --arg ws "$WS_CHANGED" \
              --arg cron "$CRON_CHANGED" \
              --arg migrate "$MIGRATE_CHANGED" \
              --arg proxy "$PROXY_CHANGED" \
              '[
                (if $web == "true" then {service: "web", dockerfile: "apps/web/Dockerfile"} else empty end),
                (if $api == "true" then {service: "api", dockerfile: "apps/api/Dockerfile"} else empty end),
                (if $ws == "true" then {service: "ws", dockerfile: "apps/ws/Dockerfile"} else empty end),
                (if $cron == "true" then {service: "cron", dockerfile: "apps/cron/Dockerfile"} else empty end),
                (if $migrate == "true" then {service: "migrate", dockerfile: "apps/migrate/Dockerfile"} else empty end),
                (if $proxy == "true" then {service: "proxy", dockerfile: "infra/proxy/Dockerfile", context: "infra/proxy"} else empty end)
              ] | {include: .}'
          )"
          count="$(jq '.include | length' <<<"$matrix")"

          echo "deploy_matrix=${matrix}" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "has_deploy_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_deploy_changes=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "### Affected deploy services"
            echo ""
            if [ "$count" -gt 0 ]; then
              jq -r '.include[] | "- `" + .service + "`"' <<<"$matrix"
            else
              echo "No deployable service images changed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check workspace peer dependencies
        run: bun scripts/check-peer-deps.ts

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/myapp_test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-test-secret
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      APP_NAME: MyApp
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      WS_API_SECRET: ci-ws-secret
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        run: bun run db:migrate

      - name: Test
        run: bun run test

  docker:
    name: Docker ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [changes, lint, build, test]
    if: ${{ needs.changes.outputs.has_deploy_changes == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.deploy_matrix) }}
    concurrency:
      group: docker-${{ github.ref_name }}-${{ matrix.service }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate Caddyfile
        if: ${{ matrix.service == 'proxy' }}
        run: docker run --rm -v "$PWD/infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Extract image metadata
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}-${{ matrix.service }}
            org.opencontainers.image.description=Bun Full-Stack Starter ${{ matrix.service }} container image
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ env.REPOSITORY_URL }}

      - name: Build image
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          tags: local/${{ matrix.service }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          build-args: |
            ${{ matrix.service == 'web' && format('NEXT_PUBLIC_APP_NAME={0}', vars.NEXT_PUBLIC_APP_NAME || 'CI') || '' }}
            ${{ matrix.service == 'web' && format('NEXT_PUBLIC_TURNSTILE_SITE_KEY={0}', vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || 'test') || '' }}

      - name: Prepare image artifact directory
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
        run: mkdir -p "${RUNNER_TEMP}/images"

      - name: Build image artifact
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          tags: local/${{ matrix.service }}:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/images/${{ matrix.service }}.tar
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ${{ matrix.service == 'web' && format('NEXT_PUBLIC_APP_NAME={0}', vars.NEXT_PUBLIC_APP_NAME || 'CI') || '' }}
            ${{ matrix.service == 'web' && format('NEXT_PUBLIC_TURNSTILE_SITE_KEY={0}', vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || 'test') || '' }}

      - name: Load image artifact for smoke test
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
        run: docker load --input "${RUNNER_TEMP}/images/${{ matrix.service }}.tar"

      - name: Smoke test image
        env:
          IMAGE: local/${{ matrix.service }}:${{ github.sha }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          container="app-${SERVICE}-smoke-${{ github.run_id }}-${{ github.run_attempt }}"

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }

          wait_for_http() {
            local port="$1"
            local path="$2"
            local host_port
            host_port="$(docker port "$container" "${port}/tcp" | sed 's/.*://')"

            for attempt in {1..30}; do
              if curl -fsS "http://127.0.0.1:${host_port}${path}"; then
                return 0
              fi
              if [[ "$(docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null)" != "true" ]]; then
                docker logs "$container"
                return 1
              fi
              sleep 1
            done

            docker logs "$container"
            return 1
          }

          cleanup
          trap cleanup EXIT

          case "$SERVICE" in
            web)
              docker run -d --rm --name "$container" -p 127.0.0.1::3000 "$IMAGE"
              if ! docker exec "$container" test -w /app/apps/web/.next/cache; then
                docker logs "$container"
                exit 1
              fi
              wait_for_http 3000 /health
              ;;
            api)
              docker run -d --rm --name "$container" -p 127.0.0.1::3001 \
                -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/myapp_smoke \
                -e REDIS_URL=redis://127.0.0.1:6379 \
                -e BETTER_AUTH_SECRET=ci-smoke-secret \
                -e BETTER_AUTH_URL=http://localhost:3000 \
                -e APP_URL=http://localhost:3000 \
                -e APP_NAME=MyApp \
                -e TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA \
                -e WS_API_SECRET=ci-ws-secret \
                "$IMAGE"
              wait_for_http 3001 /api/health
              ;;
            ws)
              docker run -d --rm --name "$container" -p 127.0.0.1::3002 \
                -e REDIS_URL=redis://127.0.0.1:6379 \
                -e WS_AUTH_URL=http://127.0.0.1:3001/api/auth/get-session \
                -e WS_AUTHORIZE_URL=http://127.0.0.1:3001/api/ws/authorize \
                -e WS_EVENTS_URL=http://127.0.0.1:3001/api/ws/events \
                -e WS_API_SECRET=ci-ws-secret \
                "$IMAGE"
              wait_for_http 3002 /health
              ;;
            proxy)
              docker run -d --rm --name "$container" -p 127.0.0.1::8080 \
                -e PORT=8080 \
                -e API_URL=http://127.0.0.1:1 \
                -e WEB_URL=http://127.0.0.1:1 \
                -e WS_URL=http://127.0.0.1:1 \
                "$IMAGE"
              wait_for_http 8080 /robots.txt
              ;;
            cron)
              trap - EXIT
              cleanup
              docker run --rm --entrypoint sh "$IMAGE" -c 'test -f /app/apps/cron/dist/cleanup.js'
              ;;
            migrate)
              trap - EXIT
              cleanup
              docker run --rm --entrypoint sh "$IMAGE" -c 'test -f /app/apps/migrate/dist/migrate.js && test -d /app/apps/migrate/dist/migrations'
              ;;
          esac

      - name: Upload image artifact
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.service }}-${{ github.sha }}
          path: ${{ runner.temp }}/images/${{ matrix.service }}.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [changes, docker]
    if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && needs.changes.outputs.has_deploy_changes == 'true' }}
    environment:
      name: production
    permissions:
      actions: write
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.deploy_matrix) }}
    concurrency:
      group: release-${{ github.ref_name }}-${{ matrix.service }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-${{ matrix.service }}-${{ github.sha }}
          path: ${{ runner.temp }}/images

      - name: Load image artifact
        run: docker load --input "${RUNNER_TEMP}/images/${{ matrix.service }}.tar"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image tags
        id: publish-image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          image="$(printf '%s/%s' "${IMAGE_PREFIX}" "${SERVICE}" | tr '[:upper:]' '[:lower:]')"
          source_tag="local/${SERVICE}:${GITHUB_SHA}"
          sha_tag="${image}:sha-${GITHUB_SHA}"
          latest_tag="${image}:latest"

          docker tag "$source_tag" "$sha_tag"
          docker push "$sha_tag"
          docker tag "$source_tag" "$latest_tag"
          docker push "$latest_tag"

          echo "image=${sha_tag}" >> "$GITHUB_OUTPUT"

      - name: Deploy Railway image through API
        id: railway-image
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ matrix.service }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -eu
          scripts/railway-deploy-image.sh

      - name: Summarize release
        run: |
          {
            echo "### Released \`${{ matrix.service }}\`"
            echo ""
            echo "- Published image: \`${{ steps.publish-image.outputs.image }}\`"
            echo "- Service ID: \`${{ steps.railway-image.outputs.service_id }}\`"
            echo "- Environment ID: \`${{ steps.railway-image.outputs.environment_id }}\`"
            echo "- Patch workflow ID: \`${{ steps.railway-image.outputs.patch_workflow_id }}\`"
            echo "- Previous source image: \`${{ steps.railway-image.outputs.before_image }}\`"
            echo "- Source image after update: \`${{ steps.railway-image.outputs.after_update_image }}\`"
            echo "- Command: \`scripts/railway-deploy-image.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete image artifact
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: image-${{ matrix.service }}-${{ github.sha }}
        run: |
          set -euo pipefail

          artifact_id="$(
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${ARTIFACT_NAME}" \
              --jq '.artifacts[0].id // empty'
          )"

          if [ -n "$artifact_id" ]; then
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          fi

  docker-images:
    name: Docker Images
    runs-on: ubuntu-latest
    needs: [changes, docker, release]
    if: ${{ always() }}
    steps:
      - name: Verify affected image jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          HAS_DEPLOY_CHANGES: ${{ needs.changes.outputs.has_deploy_changes }}
        run: |
          set -euo pipefail

          echo "Changes result: ${CHANGES_RESULT}"
          echo "Docker result: ${DOCKER_RESULT}"
          echo "Release result: ${RELEASE_RESULT}"
          echo "Event name: ${EVENT_NAME}"
          echo "Git ref: ${GITHUB_REF}"
          echo "Has deploy changes: ${HAS_DEPLOY_CHANGES}"

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Deploy change detection did not complete successfully." >&2
            exit 1
          fi

          if [ "$HAS_DEPLOY_CHANGES" = "true" ]; then
            if [ "$DOCKER_RESULT" != "success" ]; then
              echo "One or more affected Docker image builds failed, were cancelled, or were skipped." >&2
              exit 1
            fi

            if [ "$EVENT_NAME" = "push" ] || { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; }; then
              if [ "$RELEASE_RESULT" != "success" ]; then
                echo "One or more affected releases failed, were cancelled, or were skipped." >&2
                exit 1
              fi
            elif [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              if [ "$RELEASE_RESULT" != "skipped" ] && [ "$RELEASE_RESULT" != "success" ]; then
                echo "Release jobs ended unexpectedly for a validation-only run." >&2
                exit 1
              fi
            else
              echo "Unexpected event for deploy image verification: ${EVENT_NAME}" >&2
              exit 1
            fi
          else
            if [ "$DOCKER_RESULT" != "skipped" ] && [ "$DOCKER_RESULT" != "success" ]; then
              echo "Docker image jobs ended unexpectedly for a no-change run." >&2
              exit 1
            fi
            if [ "$RELEASE_RESULT" != "skipped" ] && [ "$RELEASE_RESULT" != "success" ]; then
              echo "Release jobs ended unexpectedly for a no-change run." >&2
              exit 1
            fi
          fi
