name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  REPOSITORY_URL: https://github.com/${{ github.repository }}

jobs:
  changes:
    name: Detect Deploy Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.turbo.outputs.web }}
      api: ${{ steps.turbo.outputs.api }}
      ws: ${{ steps.turbo.outputs.ws }}
      cron: ${{ steps.turbo.outputs.cron }}
      migrate: ${{ steps.turbo.outputs.migrate }}
      proxy: ${{ steps.filter.outputs.proxy }}
      deploy_matrix: ${{ steps.matrix.outputs.deploy_matrix }}
      has_deploy_changes: ${{ steps.matrix.outputs.has_deploy_changes }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect affected Turbo services
        id: turbo
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # On the initial push to a branch, github.event.before is the zero
          # sha — there is no base commit to diff against, so treat every
          # service as affected (matching paths-filter's "initial push =
          # everything added" semantics) instead of diffing HEAD against
          # itself via merge-base.
          if [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            for service in web api ws cron migrate; do
              echo "${service}=true" >> "${GITHUB_OUTPUT}"
            done
            {
              echo "### Turbo affected build tasks"
              echo ""
              echo "Initial push detected — all services treated as affected."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [ -z "${BASE_SHA}" ]; then
            BASE_SHA="$(git merge-base HEAD origin/main)"
          fi

          raw_output="${RUNNER_TEMP}/turbo-affected.raw"
          json_output="${RUNNER_TEMP}/turbo-affected.json"

          bunx turbo query affected \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --tasks build > "${raw_output}"

          sed -n '/^{/,$p' "${raw_output}" > "${json_output}"

          for service in web api ws cron migrate; do
            task="@app/${service}#build"
            if jq -e --arg task "${task}" '.data.affectedTasks.items[]? | select(.fullName == $task)' "${json_output}" >/dev/null; then
              echo "${service}=true" >> "${GITHUB_OUTPUT}"
            else
              echo "${service}=false" >> "${GITHUB_OUTPUT}"
            fi
          done

          {
            echo "### Turbo affected build tasks"
            echo ""
            jq -r '.data.affectedTasks.items[]?.fullName // empty' "${json_output}" | sed 's/^/- `/' | sed 's/$/`/'
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            proxy:
              - 'infra/proxy/**'

      - name: Build affected service matrix
        id: matrix
        env:
          WEB_CHANGED: ${{ steps.turbo.outputs.web }}
          API_CHANGED: ${{ steps.turbo.outputs.api }}
          WS_CHANGED: ${{ steps.turbo.outputs.ws }}
          CRON_CHANGED: ${{ steps.turbo.outputs.cron }}
          MIGRATE_CHANGED: ${{ steps.turbo.outputs.migrate }}
          PROXY_CHANGED: ${{ steps.filter.outputs.proxy }}
        run: |
          set -euo pipefail

          matrix="$(
            jq -cn \
              --arg web "$WEB_CHANGED" \
              --arg api "$API_CHANGED" \
              --arg ws "$WS_CHANGED" \
              --arg cron "$CRON_CHANGED" \
              --arg migrate "$MIGRATE_CHANGED" \
              --arg proxy "$PROXY_CHANGED" \
              '[
                (if $web == "true" then {service: "web", dockerfile: "apps/web/Dockerfile"} else empty end),
                (if $api == "true" then {service: "api", dockerfile: "apps/api/Dockerfile"} else empty end),
                (if $ws == "true" then {service: "ws", dockerfile: "apps/ws/Dockerfile"} else empty end),
                (if $cron == "true" then {service: "cron", dockerfile: "apps/cron/Dockerfile"} else empty end),
                (if $migrate == "true" then {service: "migrate", dockerfile: "apps/migrate/Dockerfile"} else empty end),
                (if $proxy == "true" then {service: "proxy", dockerfile: "infra/proxy/Dockerfile", context: "infra/proxy"} else empty end)
              ] | {include: .}'
          )"
          count="$(jq '.include | length' <<<"$matrix")"

          echo "deploy_matrix=${matrix}" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "has_deploy_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_deploy_changes=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "### Affected deploy services"
            echo ""
            if [ "$count" -gt 0 ]; then
              jq -r '.include[] | "- `" + .service + "`"' <<<"$matrix"
            else
              echo "No deployable service images changed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check workspace peer dependencies
        run: bun scripts/check-peer-deps.ts

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/myapp_test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-test-secret
      BETTER_AUTH_URL: http://localhost:3000
      APP_NAME: MyApp
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      WS_API_SECRET: ci-ws-secret
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        run: bun run db:migrate

      - name: Test
        run: bun run test

  docker:
    name: Docker ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [changes, lint, build, test]
    if: ${{ needs.changes.outputs.has_deploy_changes == 'true' }}
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'ci' }}
      deployment: false
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.deploy_matrix) }}
    concurrency:
      group: docker-${{ github.ref_name }}-${{ matrix.service }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate Caddyfile
        if: ${{ matrix.service == 'proxy' }}
        run: docker run --rm -v "$PWD/infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Build image
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          build-args: |
            ${{ matrix.service == 'web' && format('NEXT_PUBLIC_APP_NAME={0}', vars.NEXT_PUBLIC_APP_NAME || 'MyApp') || '' }}
            ${{ matrix.service == 'web' && format('NEXT_PUBLIC_TURNSTILE_SITE_KEY={0}', vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || 'test') || '' }}

      - name: Extract image metadata
        if: ${{ github.event_name == 'push' }}
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}-${{ matrix.service }}
            org.opencontainers.image.description=Bun Full-Stack Starter ${{ matrix.service }} container image
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ env.REPOSITORY_URL }}

      - name: Resolve image name
        if: ${{ github.event_name == 'push' }}
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          image="$(printf '%s/%s' "${IMAGE_PREFIX}" "${SERVICE}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "sha_tag=${image}:sha-${GITHUB_SHA}"
            echo "latest_tag=${image}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: ${{ github.event_name == 'push' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.latest_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ${{ matrix.service == 'web' && format('NEXT_PUBLIC_APP_NAME={0}', vars.NEXT_PUBLIC_APP_NAME || 'MyApp') || '' }}
            ${{ matrix.service == 'web' && format('NEXT_PUBLIC_TURNSTILE_SITE_KEY={0}', vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || 'test') || '' }}

      - name: Summarize published image
        if: ${{ github.event_name == 'push' }}
        run: |
          {
            echo "### Published \`${{ matrix.service }}\` image"
            echo ""
            echo "- Image: \`${{ steps.image.outputs.sha_tag }}\`"
            echo "- Repository: ${{ env.REPOSITORY_URL }}"
            echo "- Note: New GHCR container packages default to private. If this is the first publish for this image, open its package settings on GitHub and change visibility to Public for anonymous pulls."
          } >> "$GITHUB_STEP_SUMMARY"

  railway-deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [changes, docker]
    # needs.docker.result is checked explicitly so a partially failed image
    # matrix (fail-fast: false) can never deploy an incomplete set of images.
    if: ${{ github.event_name == 'push' && needs.changes.outputs.has_deploy_changes == 'true' && needs.docker.result == 'success' }}
    environment:
      name: production
      deployment: true
    permissions:
      contents: read
    # redeploy.yml shares this group string so manual redeploys and CI deploys
    # never commit Railway patches concurrently — keep them in sync. The group
    # is deliberately ref-independent: there is only one Railway environment,
    # so redeploys dispatched from any ref must serialize against CI deploys.
    concurrency:
      group: railway-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Resolve changed services
        id: services
        env:
          DEPLOY_MATRIX: ${{ needs.changes.outputs.deploy_matrix }}
        run: |
          set -euo pipefail

          services="$(jq -r '[.include[].service] | join(" ")' <<<"$DEPLOY_MATRIX")"

          echo "list=${services}" >> "$GITHUB_OUTPUT"
          if [ -n "$services" ]; then
            echo "has_services=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_services=false" >> "$GITHUB_OUTPUT"
            echo "No Railway services to deploy for this change set."
          fi

      - name: Deploy all images in one Railway patch
        if: ${{ steps.services.outputs.has_services == 'true' }}
        id: railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICES: ${{ steps.services.outputs.list }}
          OPTIONAL_SERVICES: cron
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -eu
          scripts/railway-deploy-image.sh

      - name: Summarize release
        if: ${{ steps.services.outputs.has_services == 'true' }}
        run: |
          {
            echo "### Released to Railway"
            echo ""
            echo "- Services: \`${{ steps.railway.outputs.services }}\`"
            echo "- Images: \`${{ steps.railway.outputs.images }}\`"
            echo "- Previous images: \`${{ steps.railway.outputs.before_images }}\`"
            echo "- Environment ID: \`${{ steps.railway.outputs.environment_id }}\`"
            echo "- Patch workflow ID: \`${{ steps.railway.outputs.patch_workflow_id }}\`"
            echo "- Command: \`scripts/railway-deploy-image.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-images:
    name: Docker Images
    runs-on: ubuntu-latest
    needs: [changes, lint, build, test, docker]
    if: ${{ always() }}
    steps:
      - name: Verify affected image jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          EVENT_NAME: ${{ github.event_name }}
          HAS_DEPLOY_CHANGES: ${{ needs.changes.outputs.has_deploy_changes }}
        run: |
          set -euo pipefail

          echo "Changes result: ${CHANGES_RESULT}"
          echo "Lint result: ${LINT_RESULT}"
          echo "Build result: ${BUILD_RESULT}"
          echo "Test result: ${TEST_RESULT}"
          echo "Docker result: ${DOCKER_RESULT}"
          echo "Event name: ${EVENT_NAME}"
          echo "Has deploy changes: ${HAS_DEPLOY_CHANGES}"

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Deploy change detection did not complete successfully." >&2
            exit 1
          fi

          # Fail — do not skip — when any upstream job failed, so this
          # aggregate is safe to use as the single required status check.
          if [ "$LINT_RESULT" != "success" ] || [ "$BUILD_RESULT" != "success" ] || [ "$TEST_RESULT" != "success" ]; then
            echo "Upstream lint, build, or test did not succeed." >&2
            exit 1
          fi

          if [ "$HAS_DEPLOY_CHANGES" = "true" ]; then
            if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "push" ]; then
              if [ "$DOCKER_RESULT" != "success" ]; then
                echo "One or more affected Docker image builds failed, were cancelled, or were skipped." >&2
                exit 1
              fi
            else
              echo "Unexpected event for deploy image verification: ${EVENT_NAME}" >&2
              exit 1
            fi
          else
            if [ "$DOCKER_RESULT" != "skipped" ] && [ "$DOCKER_RESULT" != "success" ]; then
              echo "Docker image jobs ended unexpectedly for a no-change run." >&2
              exit 1
            fi
          fi
