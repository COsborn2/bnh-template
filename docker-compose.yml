services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myapp
    # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker and
    # refuse to start with a mount at the old /var/lib/postgresql/data
    # (docker-library/postgres#1259), so the volume is mounted one level up.
    # It's also a new volume: an existing 17 volume can't be opened by 18, and
    # leaving it alone lets the new database start instead of refusing to.
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Local trace backend. UI at http://localhost:16686
  # Point services at it with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
  # Opt-in via the "tracing" profile: plain `docker compose up -d` skips it,
  # while `docker compose up -d jaeger` still starts it (Compose v2.20+
  # auto-activates the profiles of explicitly named services).
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["tracing"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"
      - "4317:4317"

volumes:
  pgdata18:
